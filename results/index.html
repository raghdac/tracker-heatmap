<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="https://avatars.githubusercontent.com/u/31491351?s=64&v=4">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tracker Heatmap Benchmark</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one short reading column: question, two videos with one chart each, speed, results.
     All visible text lives in the T dictionary at the bottom (English and Indonesian). */
  :root {
    --bg: #f6f7f5;
    --surface: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --rule: #e1e0d9;
    --axis: #c3c2b7;
    --accent: #00446a;
    --c-baseline: #898781;
    --c-deepsort: #2a78d6;
    --c-bytetrack: #eb6834;
    --c-botsort: #1baf7a;
    --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
    color-scheme: light; /* one light look by choice: it is shown on a projector next to light slides */
  }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.55; }
  .page { max-width: 920px; margin: 0 auto; padding-block: 32px 56px;
          padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
          display: flex; flex-direction: column; gap: 48px; }
  h1, h2 { text-wrap: balance; margin: 0; font-weight: 600; line-height: 1.2; }
  h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); max-width: 22ch; }
  h2 { font-size: 1.45rem; }
  p { margin: 0; max-width: 62ch; }
  a { color: var(--accent); }
  .eyebrow { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  .muted { color: var(--ink-2); }
  section, header { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .topbar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 20px; font-size: 0.9rem; color: var(--ink-2); }

  .pipeline { display: flex; flex-wrap: wrap; gap: 8px; }
  .step { flex: 1 1 130px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px;
          display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .step strong { font-weight: 600; }
  .step span { font-size: 0.85rem; color: var(--ink-2); }
  .step.swap { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .bg-baseline { background: var(--c-baseline); } .bg-deepsort { background: var(--c-deepsort); }
  .bg-bytetrack { background: var(--c-bytetrack); } .bg-botsort { background: var(--c-botsort); }

  video { width: 100%; height: auto; aspect-ratio: 16 / 9; background: #0b0b0b; border-radius: 6px; display: block; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { font: inherit; font-size: 0.9rem; padding: 6px 12px; border: 1px solid var(--axis); border-radius: 4px;
                background: var(--surface); color: var(--ink); cursor: pointer; }
  .seg button:hover { border-color: var(--accent); }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  .seg button:focus-visible, video:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 18px;
           display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .panel-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-weight: 600; }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(96px, 130px) 1fr 60px; align-items: center; gap: 12px; }
  .bar-label { font-size: 0.92rem; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bar-track { height: 18px; border-left: 1px solid var(--axis); background: linear-gradient(to right, var(--rule) 1px, transparent 1px) 0 0 / 25% 100%; }
  .bar { display: block; height: 100%; border-radius: 0 4px 4px 0; transition: width 0.35s ease; }
  .bar-value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.92rem; text-align: right; }
  .note { font-size: 0.85rem; color: var(--ink-2); }

  .findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
  .finding { display: flex; flex-direction: column; gap: 6px; border-top: 3px solid var(--accent); padding-top: 10px; }
  .finding strong { font-weight: 600; }
  .finding span { font-size: 0.92rem; color: var(--ink-2); }
  ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; max-width: 62ch; }
  footer { border-top: 1px solid var(--rule); padding-top: 14px; font-size: 0.8rem; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }

  @media (max-width: 640px) { .bar-row { grid-template-columns: 92px 1fr 50px; gap: 8px; } .panel { padding: 14px; } }
  @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
</style>

<div class="page">

  <header>
    <div class="topbar">
      <span class="eyebrow" data-t="eyebrow"></span>
      <div class="seg" id="lang" role="group" aria-label="Language / Bahasa"></div>
    </div>
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
    <div class="meta">
      <span>R. Raghda Hassa Parardhya Cornika</span>
      <span data-t="dept"></span>
      <span data-t="supervisor"></span>
    </div>
  </header>

  <section>
    <h2 data-t="methodTitle"></h2>
    <div class="pipeline" id="pipeline" role="img">
      <div class="step"><strong data-t="step1"></strong><span>MOT20, MOT17</span></div>
      <div class="step"><strong>YOLOv8n</strong><span data-t="step2d"></span></div>
      <div class="step swap"><strong>Tracker</strong><span data-t="step3d"></span></div>
      <div class="step"><strong>Heatmap</strong><span data-t="step4d"></span></div>
      <div class="step"><strong data-t="step5"></strong><span data-t="step5d"></span></div>
    </div>
  </section>

  <section id="live">
    <h2 data-t="liveTitle"></h2>
    <p class="muted" data-t="liveLead"></p>
    <video controls muted loop playsinline preload="metadata" poster="video/live_run_MOT20-02.jpg" src="video/live_run_MOT20-02.mp4"></video>
  </section>

  <section id="tracking">
    <h2 data-t="trackTitle"></h2>
    <p class="muted" data-t="trackLead"></p>
    <video controls muted loop playsinline preload="metadata" poster="video/tracking_MOT17-11.jpg" src="video/tracking_MOT17-11.mp4"></video>
    <div class="panel">
      <div class="panel-head"><span data-t="trackChart"></span><div class="seg" id="t-scenario"></div></div>
      <div class="bars" id="t-bars"></div>
      <p class="note" id="t-reading"></p>
    </div>
  </section>

  <section id="heatmaps">
    <h2 data-t="heatTitle"></h2>
    <p class="muted" data-t="heatLead"></p>
    <div class="seg" id="h-res"></div>
    <video id="v-heatmap" controls muted loop playsinline preload="metadata"></video>
    <div class="panel">
      <div class="panel-head"><span data-t="heatChart"></span></div>
      <div class="bars" id="h-bars"></div>
      <p class="note" id="h-reading"></p>
    </div>
  </section>

  <section id="speed">
    <h2 data-t="speedTitle"></h2>
    <div class="panel">
      <div class="panel-head"><span data-t="speedChart"></span></div>
      <div class="bars" id="s-bars"></div>
      <p class="note" data-t="speedNote"></p>
    </div>
  </section>

  <section>
    <h2 data-t="findTitle"></h2>
    <div class="findings">
      <div class="finding"><strong data-t="find1"></strong><span data-t="find1d"></span></div>
      <div class="finding"><strong data-t="find2"></strong><span data-t="find2d"></span></div>
      <div class="finding"><strong data-t="find3"></strong><span data-t="find3d"></span></div>
    </div>
  </section>

  <section>
    <h2 data-t="limitTitle"></h2>
    <ul>
      <li data-t="limit1"></li>
      <li data-t="limit2"></li>
      <li data-t="limit3"></li>
    </ul>
  </section>

  <footer>
    <span id="foot-generated"></span>
    <span data-t="credit"></span>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  const D = window.SITE_DATA;
  const $ = (id) => document.getElementById(id);

  const T = {
    en: {
      eyebrow: 'Undergraduate thesis · Results seminar · Draft',
      title: 'Which tracker makes the best customer heatmap?',
      lead: 'Same detector, same videos. Only the tracker is different. The videos and numbers below come from my experiment results.',
      dept: 'Electronics and Instrumentation, Universitas Gadjah Mada',
      supervisor: 'Supervisor: Prof. Drs. Agus Harjoko, M.Sc., Ph.D.',
      methodTitle: 'How it works: only the tracker changes',
      pipelineLabel: 'Steps: video, YOLOv8n detector, one of three trackers, heatmap, comparison with the ground truth',
      step1: 'Video', step2d: 'finds the people', step3d: 'DeepSORT, ByteTrack or BoT-SORT',
      step4d: 'shows where people walk', step5: 'Compare', step5d: 'with the correct answer (ground truth)',
      liveTitle: 'The code running',
      liveLead: 'Recorded by the program itself while it ran on my PC. Left: the loop that is running and what it prints. Right: the result, frame by frame. Nothing in this video is replayed from saved results.',
      trackTitle: '1. Tracking',
      trackLead: 'Each colour is one person. If the colour changes, the tracker gave that person a new ID (an ID switch).',
      trackChart: 'Tracking score (HOTA). Higher is better.',
      crowded: 'Crowded place (MOT20)', moving: 'Moving camera (MOT17)',
      trackReading: '{best} is the best and {last} is the lowest. The difference is {gap}. Bars go from 0 to {max}.',
      heatTitle: '2. Heatmaps',
      heatLead: 'A sped-up video of one scene. Change the detector image size to see the biggest difference.',
      res: 'Image size {res} px',
      heatChart: 'How close the heatmap is to the correct one (SSIM). Higher is better.',
      heatReading: 'At {res} px, a tracker adds only {gain} compared with no tracker. A bigger image (640 to 1280 px) adds {gainRes}. Bars go from 0 to 1.',
      speedTitle: '3. Speed',
      speedChart: 'Frames per second in crowded scenes. Higher is faster.',
      speedNote: 'The detector runs on a GTX 1650 SUPER and the trackers on the CPU. DeepSORT is the slowest because its appearance model also runs on the CPU. Bars go from 0 to 80.',
      findTitle: 'Main results',
      find1: 'BoT-SORT is the most accurate', find1d: 'But the difference is small.',
      find2: 'A tracker changes the heatmap very little', find2d: 'SSIM is {base} with no tracker and {best} with the best tracker.',
      find3: 'The detector matters most', find3d: 'A bigger image (1280 px) raises SSIM to about {big}.',
      limitTitle: 'Limits of this study',
      limit1: 'Only three videos per scenario, so the differences are not yet statistically confirmed.',
      limit2: 'MOT17 and MOT20 show people on streets and in public places, not in a shop. The retail test is not done yet.',
      limit3: 'YOLOv8n is used as it is, with no extra training.',
      generated: 'Data made on {date}. These are draft results for the results seminar.',
      credit: 'Video frames and annotations: MOT17 (Milan et al., 2016) and MOT20 (Dendorfer et al., 2020), MOTChallenge, CC BY-NC-SA 3.0, shown for academic, non-commercial use.',
      baseline: 'No tracker',
    },
    id: {
      eyebrow: 'Skripsi S1 · Seminar hasil · Draf',
      title: 'Tracker mana yang menghasilkan heatmap pelanggan terbaik?',
      lead: 'Detektor sama, video sama. Yang berbeda hanya tracker-nya. Video dan angka di bawah berasal dari hasil eksperimen saya.',
      dept: 'Elektronika dan Instrumentasi, Universitas Gadjah Mada',
      supervisor: 'Pembimbing: Prof. Drs. Agus Harjoko, M.Sc., Ph.D.',
      methodTitle: 'Cara kerja: hanya tracker yang diganti',
      pipelineLabel: 'Langkah: video, detektor YOLOv8n, salah satu dari tiga tracker, heatmap, perbandingan dengan data acuan',
      step1: 'Video', step2d: 'mendeteksi orang', step3d: 'DeepSORT, ByteTrack, atau BoT-SORT',
      step4d: 'menunjukkan tempat orang berjalan', step5: 'Bandingkan', step5d: 'dengan data acuan (ground truth)',
      liveTitle: 'Kode saat berjalan',
      liveLead: 'Direkam oleh programnya sendiri saat berjalan di PC saya. Kiri: perulangan yang sedang berjalan dan teks yang dicetaknya. Kanan: hasilnya, frame demi frame. Tidak ada bagian video ini yang diputar ulang dari hasil tersimpan.',
      trackTitle: '1. Pelacakan',
      trackLead: 'Satu warna berarti satu orang. Kalau warnanya berubah, tracker memberi ID baru ke orang itu (ID switch).',
      trackChart: 'Skor pelacakan (HOTA). Makin tinggi makin baik.',
      crowded: 'Tempat ramai (MOT20)', moving: 'Kamera bergerak (MOT17)',
      trackReading: '{best} paling baik dan {last} paling rendah. Selisihnya {gap}. Batang dari 0 sampai {max}.',
      heatTitle: '2. Heatmap',
      heatLead: 'Video dipercepat dari satu adegan. Ganti ukuran gambar detektor untuk melihat perbedaan terbesar.',
      res: 'Ukuran gambar {res} px',
      heatChart: 'Kemiripan heatmap dengan heatmap acuan (SSIM). Makin tinggi makin baik.',
      heatReading: 'Pada {res} px, tracker hanya menambah {gain} dibanding tanpa tracker. Gambar yang lebih besar (640 ke 1280 px) menambah {gainRes}. Batang dari 0 sampai 1.',
      speedTitle: '3. Kecepatan',
      speedChart: 'Frame per detik di adegan ramai. Makin tinggi makin cepat.',
      speedNote: 'Detektor berjalan di GTX 1650 SUPER dan tracker di CPU. DeepSORT paling lambat karena model appearance-nya juga berjalan di CPU. Batang dari 0 sampai 80.',
      findTitle: 'Hasil utama',
      find1: 'BoT-SORT paling akurat', find1d: 'Tetapi selisihnya kecil.',
      find2: 'Tracker hanya sedikit mengubah heatmap', find2d: 'SSIM {base} tanpa tracker dan {best} dengan tracker terbaik.',
      find3: 'Detektor paling berpengaruh', find3d: 'Gambar yang lebih besar (1280 px) menaikkan SSIM menjadi sekitar {big}.',
      limitTitle: 'Batasan penelitian',
      limit1: 'Hanya tiga video per skenario, jadi perbedaannya belum terbukti secara statistik.',
      limit2: 'MOT17 dan MOT20 berisi orang di jalan dan tempat umum, bukan di toko. Uji di toko ritel belum dilakukan.',
      limit3: 'YOLOv8n dipakai apa adanya, tanpa pelatihan tambahan.',
      generated: 'Data dibuat pada {date}. Ini hasil draf untuk seminar hasil.',
      credit: 'Frame video dan anotasi: MOT17 (Milan dkk., 2016) dan MOT20 (Dendorfer dkk., 2020), MOTChallenge, CC BY-NC-SA 3.0, ditampilkan untuk keperluan akademik nonkomersial.',
      baseline: 'Tanpa tracker',
    },
  };
  const LANGS = { en: 'English', id: 'Indonesia' };
  const TRACKERS = ['deepsort', 'bytetrack', 'botsort'];
  const CONFIGS = ['baseline'].concat(TRACKERS);
  const state = { lang: 'en', scenario: 'crowded', res: '640' };

  /* the language choice is a per-viewer convenience: ?lang=id in the link, else the last choice in this browser */
  try {
    const wanted = new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang');
    if (T[wanted]) state.lang = wanted;
  } catch (e) { /* storage can be blocked; English is the default */ }

  const t = (key, vars) => T[state.lang][key].replace(/\{(\w+)\}/g, (_, k) => vars[k]);
  const num = (v, digits) => { const s = v.toFixed(digits); return state.lang === 'id' ? s.replace('.', ',') : s; };
  const name = (k) => ({ baseline: t('baseline'), deepsort: 'DeepSORT', bytetrack: 'ByteTrack', botsort: 'BoT-SORT' })[k];

  function segmented(el, options, value, onChange) {
    el.innerHTML = '';
    Object.entries(options).forEach(([key, label]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', String(key === value));
      b.addEventListener('click', () => onChange(key));
      el.appendChild(b);
    });
  }

  function bars(el, keys, value, max, digits) {
    el.innerHTML = keys.map((k) =>
      '<div class="bar-row" title="' + name(k) + ': ' + num(value(k), digits) + '">' +
      '<span class="bar-label"><i class="dot bg-' + k + '"></i>' + name(k) + '</span>' +
      '<span class="bar-track"><span class="bar bg-' + k + '" style="width:' + (value(k) / max * 100).toFixed(2) + '%"></span></span>' +
      '<span class="bar-value">' + num(value(k), digits) + '</span></div>').join('');
  }

  function render() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll('[data-t]').forEach((el) => { if (T[state.lang][el.dataset.t].indexOf('{') < 0) el.textContent = t(el.dataset.t); });
    $('pipeline').setAttribute('aria-label', t('pipelineLabel'));
    segmented($('lang'), LANGS, state.lang, (key) => {
      state.lang = key;
      try { localStorage.setItem('lang', key); } catch (e) { /* not saved; the page still switches */ }
      render();
    });

    const track = D.tracking['640'][state.scenario];
    segmented($('t-scenario'), { crowded: t('crowded'), moving: t('moving') }, state.scenario, (key) => { state.scenario = key; render(); });
    bars($('t-bars'), TRACKERS, (k) => track[k].HOTA, 0.4, 3);
    const order = TRACKERS.slice().sort((a, b) => track[b].HOTA - track[a].HOTA);
    $('t-reading').textContent = t('trackReading', { best: name(order[0]), last: name(order[2]), gap: num(track[order[0]].HOTA - track[order[2]].HOTA, 3), max: num(0.4, 1) });

    const video = $('v-heatmap'), base = 'video/heatmap_MOT20-02_' + state.res;
    if (video.dataset.res !== state.res) { video.dataset.res = state.res; video.poster = base + '.jpg'; video.src = base + '.mp4'; }
    const heat = D.heat[state.res];
    segmented($('h-res'), { '640': t('res', { res: 640 }), '1280': t('res', { res: 1280 }) }, state.res, (key) => { state.res = key; render(); });
    bars($('h-bars'), CONFIGS, (k) => heat[k].SSIM, 1, 3);
    const best = (r) => Math.max.apply(null, TRACKERS.map((k) => D.heat[r][k].SSIM));
    $('h-reading').textContent = t('heatReading', { res: state.res, gain: num(best(state.res) - heat.baseline.SSIM, 3),
      gainRes: num(D.heat['1280'].baseline.SSIM - D.heat['640'].baseline.SSIM, 3) });

    bars($('s-bars'), CONFIGS, (k) => D.runtime.crowded[k], 80, 1);
    document.querySelector('[data-t="find2d"]').textContent = t('find2d', { base: num(D.heat['640'].baseline.SSIM, 3), best: num(best('640'), 3) });
    document.querySelector('[data-t="find3d"]').textContent = t('find3d', { big: num(best('1280'), 2) });
    $('foot-generated').textContent = t('generated', { date: D.generated });
  }
  render();
  /* a link such as results/#heatmaps opens at that part; the page is filled by script, so scroll after the first render */
  const part = /^#[a-z]+$/.test(location.hash) && document.getElementById(location.hash.slice(1));
  if (part) part.scrollIntoView();
})();
</script>

</body>
</html>
